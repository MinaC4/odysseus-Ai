apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: odysseus-data
  namespace: odysseus
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
